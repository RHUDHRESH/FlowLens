[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlens-rca"
version = "0.4.0"
description = "FlowLens RCA Lab - evidence-first elevator fault isolation and root cause analysis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pyarrow>=16.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
flowlens = "flowlens.cli:main"

[tool.setuptools.packages.find]
include = ["flowlens*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
