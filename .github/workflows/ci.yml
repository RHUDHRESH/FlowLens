name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check flowlens apps tests benchmarks
      - name: Mypy
        run: python -m mypy flowlens apps
      - name: Pytest
        run: python -m pytest -q
      - name: Demo contract
        run: python -m flowlens verify --seed 20260915

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Typecheck and build
        working-directory: apps/console
        run: |
          npm install
          npm run typecheck
          npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t flowlens-rca:ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: |
          if git grep -I -E -i 'api[_-]?key|secret_key|BEGIN (RSA |OPENSSH )?PRIVATE' -- ':!.github/**' ':!docs/**' ':!*.md'; then
            echo "Possible secret material found" >&2
            exit 1
          fi
          echo "No obvious secrets in tracked files."
